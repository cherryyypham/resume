# base_content.yml - everything everywhere all at once cherry resume, ever growing and evolving.

# Each bullet carries:
#   text      [NOT NULL] final LaTeX-escaped sentence
#   short     tighter phrasing; the packer falls back to this before
#             dropping the bullet entirely
#   tags      role buckets this bullet speaks to (ai, ml, backend, data, ...)
#   keywords  concrete tech/skill tokens, lowercase, matched against --keywords
#             and against text extracted from a job description via --jd
#   weight    manual thumb on the scale, -3..+5. Use +3..+5 for "this line goes
#             on every resume", negative to bury something without deleting it.

